name: backend cd

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: rmsckd1640
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . #작업영역
          file: ./Dockerfile
          push: true
          tags: rmsckd1640/the-labot-backend:latest
          #GHA 캐시(type=gha)는 사용하지 않는다.
          #러너의 Maven 다운로드(24.5s)보다 캐시 레이어 전송 비용(다운 ~19s + 업로드 33~56s)이 커서 순손실 (#168)

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/the-labot-backend"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/the-labot-backend
            docker pull rmsckd1640/the-labot-backend:latest
            docker compose up -d --remove-orphans
            docker image prune -f
