name: backend cd

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: rmsckd1640
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . #작업영역
          file: ./Dockerfile
          push: true
          tags: rmsckd1640/the-labot-backend:latest
          #GHA 캐시(type=gha)는 사용하지 않는다.
          #러너의 Maven 다운로드(24.5s)보다 캐시 레이어 전송 비용(다운 ~19s + 업로드 33~56s)이 커서 순손실 (#168)

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/the-labot-backend"

      #운영 .env의 출처는 GitHub Secrets 하나. 배포마다 새로 생성하므로 서버를 재생성해도 복구됨
      - name: Create .env on EC2
        uses: appleboy/ssh-action@master
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          IAM_ACCESS_KEY: ${{ secrets.IAM_ACCESS_KEY }}
          IAM_SECRET_KEY: ${{ secrets.IAM_SECRET_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          NCP_OCR_INVOKE_URL: ${{ secrets.NCP_OCR_INVOKE_URL }}
          NCP_OCR_SECRET_KEY: ${{ secrets.NCP_OCR_SECRET_KEY }}
          NCP_OCR_IDCARD_URL: ${{ secrets.NCP_OCR_IDCARD_URL }}
          NCP_OCR_IDCARD_KEY: ${{ secrets.NCP_OCR_IDCARD_KEY }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_SENDER_NUMBER: ${{ secrets.SOLAPI_SENDER_NUMBER }}
          SOLAPI_API_URL: ${{ secrets.SOLAPI_API_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          envs: MYSQL_ROOT_PASSWORD,JWT_SECRET_KEY,IAM_ACCESS_KEY,IAM_SECRET_KEY,S3_BUCKET_NAME,NCP_OCR_INVOKE_URL,NCP_OCR_SECRET_KEY,NCP_OCR_IDCARD_URL,NCP_OCR_IDCARD_KEY,SOLAPI_API_KEY,SOLAPI_API_SECRET,SOLAPI_SENDER_NUMBER,SOLAPI_API_URL
          script: |
            mkdir -p /home/ubuntu/the-labot-backend
            cat > /home/ubuntu/the-labot-backend/.env <<EOF
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            MYSQL_DATABASE=the_labot
            JWT_SECRET_KEY=$JWT_SECRET_KEY
            IAM_ACCESS_KEY=$IAM_ACCESS_KEY
            IAM_SECRET_KEY=$IAM_SECRET_KEY
            S3_BUCKET_NAME=$S3_BUCKET_NAME
            NCP_OCR_INVOKE_URL=$NCP_OCR_INVOKE_URL
            NCP_OCR_SECRET_KEY=$NCP_OCR_SECRET_KEY
            NCP_OCR_IDCARD_URL=$NCP_OCR_IDCARD_URL
            NCP_OCR_IDCARD_KEY=$NCP_OCR_IDCARD_KEY
            SOLAPI_API_KEY=$SOLAPI_API_KEY
            SOLAPI_API_SECRET=$SOLAPI_API_SECRET
            SOLAPI_SENDER_NUMBER=$SOLAPI_SENDER_NUMBER
            SOLAPI_API_URL=$SOLAPI_API_URL
            EOF
            chmod 600 /home/ubuntu/the-labot-backend/.env

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/the-labot-backend
            docker pull rmsckd1640/the-labot-backend:latest
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
